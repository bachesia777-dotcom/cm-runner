name: Post
on:
  schedule:
    - cron: "35 */2 * * *"   # every 2 hours
  workflow_dispatch: {}
concurrency: { group: posting, cancel-in-progress: false }
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: bachesia777-dotcom/content-machine
          ref: queue
          path: q
          token: ${{ secrets.PRIVATE_REPO_KEY }}
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Post
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_PAGE_TOKEN_2: ${{ secrets.META_PAGE_TOKEN_2 }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_USER_ID_2: ${{ secrets.IG_USER_ID_2 }}
          GRAPH_VERSION: ${{ vars.GRAPH_VERSION }}
          GITHUB_TOKEN: ${{ secrets.PRIVATE_REPO_KEY }}
          GITHUB_REPOSITORY: bachesia777-dotcom/content-machine
        run: |
          pip install -q -r requirements.txt
          # details stay out of the public log; results are saved in the private queue
          python robot/post_due.py --queue-dir q --ledger q/posted.csv --limit 2 > log.txt 2>&1 || true
          tail -n 1 log.txt
      - name: Save status to the private repo
        run: |
          cd q
          git config user.name "content-machine-bot"
          git config user.email "content-machine-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || { git commit -qm "Queue status update"; git pull -q --rebase origin queue; git push -q origin HEAD:queue; }
