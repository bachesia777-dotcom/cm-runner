name: Transcribe
on:
  workflow_dispatch:
    inputs:
      src: { required: true }
      out: { required: true }
jobs:
  stt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: bachesia777-dotcom/content-machine
          path: p
          token: ${{ secrets.PRIVATE_REPO_KEY }}
          sparse-checkout: work
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - env: { SRC: "${{ inputs.src }}", OUT: "${{ inputs.out }}" }
        run: |
          pip install -q faster-whisper
          cd p && python ../robot/stt.py "$SRC" "$OUT" > /dev/null 2>&1
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add "$OUT" && git commit -qm "Transcript" && git pull -q --rebase && git push -q
          echo done
